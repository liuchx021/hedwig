name: Hedwig CGM Sync

on:
  push:
    branches: [ develop, main ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21' 

    - name: Run Hedwig Backend
      env:
        CGM_USER: ${{ secrets.CGM_USER }}
        CGM_PWD: ${{ secrets.CGM_PWD }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        go run $(find . -name "main.go" | head -n 1)
