spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hedwig_test
    driver-class-name: org.postgresql.Driver
    username: hedwig
    password: hedwig
  sql:
    init:
      mode: never

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  type-enums-package: com.blueship581.hedwig.domain.enums

jwt:
  secret: "test-jwt-secret-key-must-be-at-least-256-bits-for-hs256-algorithm-here"
  expiration: 86400000

nightscout:
  enabled: false

polling:
  interval-ms: 300000
