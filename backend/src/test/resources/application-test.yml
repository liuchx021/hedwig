spring:
  datasource:
    url: jdbc:h2:mem:hedwig-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: "test-jwt-secret-key-must-be-at-least-256-bits-for-hs256-algorithm-here"
  expiration: 86400000

nightscout:
  enabled: false

polling:
  interval-ms: 300000
