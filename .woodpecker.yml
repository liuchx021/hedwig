when:
  branch: develop
  event: push

steps:
  - name: verify-release
    image: alpine:3
    commands:
      - apk add --no-cache bash git coreutils
      - bash ./scripts/verify-release-commit.sh

  - name: deploy
    image: alpine:3
    commands:
      - apk add --no-cache openssh-client coreutils
      - test -s build/hedwig.jar
      - sha256sum build/hedwig.jar
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -p 22 100.109.92.68 >> ~/.ssh/known_hosts 2>/dev/null
      - scp -o StrictHostKeyChecking=no build/hedwig.jar deploy@100.109.92.68:/opt/hedwig/app.jar.new
      - ssh deploy@100.109.92.68 "set -e; cd /opt/hedwig; sha256sum app.jar.new; mv app.jar.new app.jar; sudo systemctl restart hedwig; sudo systemctl is-active hedwig; sha256sum app.jar"
    secrets: [ssh_key]
